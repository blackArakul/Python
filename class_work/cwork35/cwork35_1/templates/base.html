<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {%block title%}
        {%if title%}
        <title>{{title}}</title>
        {%else%}
        <title>Главная страница</title>
        {%endif%}
    {%endblock%}
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
</head>
<body>
{%block content%}
    {%block menu_header%}
    <ul class="menu">
        {%for m in menu%}
        <li><a href="{{m.url}}">{{m.name}}</a></li>
        {%endfor%}
    </ul>
    {%endblock%}
<div class="content">
    {%if title%}
    <h1>{{title}}</h1>
    {%else%}
    <h1>Главная страница сайта</h1>
    {%endif%}
    {%endblock%}
</div>
</body>
</html>
