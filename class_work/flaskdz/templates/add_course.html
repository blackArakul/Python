{%extends 'base.html' %}
{%block content%}
{{super()}}

{%for cat, msg in get_flashed_messages(True) %}
    <div class="flash {{cat}}">{{msg}}</div>
{%endfor%}

<form action="{{url_for('add_course')}}" method="post">
    <p>Название курса: <input type="text" name="name" required></p>
    <p>Цена курса: <input type="text" name="price" required></p>
    <p>URL: <input type="text" name="url" required></p>
    <p>Информация о курсе:</p>
    <textarea name="course_info" cols="30" rows="10"></textarea>
    <input type="submit" value="Отправить">
</form>

{%endblock%}
